<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Luật Biển Pro</title>

<style>
body{
margin:0;
background:#343541;
font-family:Arial, sans-serif;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:800px;
height:100vh;
display:flex;
flex-direction:column;
background:#444654;
}

.header{
background:#202123;
color:white;
padding:15px;
display:flex;
align-items:center;
}

.mascot{
width:55px;
margin-right:12px;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
}

.msg{
margin:10px 0;
padding:14px;
border-radius:14px;
max-width:80%;
line-height:1.5;
white-space:pre-line;
}

.user{
background:#19c37d;
align-self:flex-end;
color:white;
}

.bot{
background:#3e3f4b;
color:white;
}

.input-box{
display:flex;
padding:15px;
background:#202123;
}

input{
flex:1;
padding:14px;
border-radius:8px;
border:none;
font-size:15px;
}

button{
margin-left:10px;
padding:14px 18px;
background:#19c37d;
border:none;
border-radius:8px;
font-weight:bold;
}

.suggestions{
padding:10px 20px;
background:#444654;
color:#ccc;
font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<img class="mascot" src="https://cdn-icons-png.flaticon.com/512/616/616494.png">
<div>
<b>AI Luật Biển Đảo 🌊</b><br>
<small>Trợ lý pháp lý đại dương</small>
</div>
</div>

<div id="chat" class="chat"></div>

<div class="suggestions">
Gợi ý: "Lãnh hải là gì?" | "So sánh lãnh hải và EEZ" | "UNCLOS quy định gì?"
</div>

<div class="input-box">
<input type="text" id="input" placeholder="Nhập câu hỏi...">
<button onclick="send()">Gửi</button>
</div>

</div>

<script>

// ===== Chuẩn hóa tiếng Việt =====
function normalize(str){
return str.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");
}

// ===== Kiến thức =====
function knowledge(q){

if(q.includes("lanh hai")){
return "📘 LÃNH HẢI\n\n- Rộng tối đa 12 hải lý.\n- Quốc gia có chủ quyền hoàn toàn.\n- Phải cho phép tàu nước ngoài qua lại vô hại.";
}

if(q.includes("eez")){
return "📘 VÙNG ĐẶC QUYỀN KINH TẾ (EEZ)\n\n- Rộng tối đa 200 hải lý.\n- Quốc gia có quyền khai thác tài nguyên.\n- Không có chủ quyền hoàn toàn như lãnh hải.";
}

if(q.includes("so sanh")){
return "📊 SO SÁNH\n\nLãnh hải: 12 hải lý – Chủ quyền hoàn toàn.\nEEZ: 200 hải lý – Quyền khai thác tài nguyên.\n\n=> Lãnh hải có mức độ chủ quyền cao hơn.";
}

if(q.includes("unc")){
return "🌍 UNCLOS 1982\n\n- Được gọi là 'Hiến pháp của Đại dương'.\n- Quy định lãnh hải 12 hải lý.\n- EEZ 200 hải lý.\n- Quyền đối với thềm lục địa.";
}

if(q.includes("them luc dia")){
return "📘 THỀM LỤC ĐỊA\n\n- Phần đáy biển kéo dài tự nhiên từ đất liền.\n- Quốc gia có quyền khai thác tài nguyên dưới đáy biển.";
}

return "🌊 Tôi có thể giải thích về lãnh hải, EEZ, UNCLOS hoặc so sánh các vùng biển.";
}

// ===== Hiệu ứng gõ chữ =====
function typeEffect(text, element){
let i=0;
let speed=20;
let timer=setInterval(()=>{
element.innerHTML+=text.charAt(i);
i++;
if(i>=text.length) clearInterval(timer);
},speed);
}

// ===== Gửi tin nhắn =====
function send(){
let input=document.getElementById("input");
let chat=document.getElementById("chat");

if(input.value.trim()==="") return;

let userMsg=document.createElement("div");
userMsg.className="msg user";
userMsg.innerText=input.value;
chat.appendChild(userMsg);

let botMsg=document.createElement("div");
botMsg.className="msg bot";
chat.appendChild(botMsg);

let answer=knowledge(normalize(input.value));
typeEffect(answer,botMsg);

chat.scrollTop=chat.scrollHeight;

// lưu lịch sử
localStorage.setItem("chatHistory",chat.innerHTML);

input.value="";
}

// ===== Load lịch sử =====
window.onload=function(){
let chat=document.getElementById("chat");
let saved=localStorage.getItem("chatHistory");
if(saved){
chat.innerHTML=saved;
}
}

</script>

</body>
</html>
