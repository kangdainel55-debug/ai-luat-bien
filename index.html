if(q.includes("vung dac quyen kinh te")){

if(q.includes("dao, vung bien")){
return "Định nghĩa đảo, vùng biển (nội thủy, lãnh hải, EEZ, vùng tiếp giáp, thềm lục địa) theo UNCLOS.\n\n Theo United Nations Convention on the Law of the Sea, các vùng biển được xác định sau:\n\n 1.Nội thủy: \n\n-Vùng nước phía trong đường cơ sở.\n\n-Quốc gia có chủ quyền hoàn toàn như trên đất liền.\n\n 2.Lãnh hải (12 hải lý):\n\n-Tính từ đường cơ sở ra 12 hải lý.\n\n-Quốc gia có chủ quyền, nhưng phải cho tàu nước ngoài quyền “qua lại vô hại”.\n\n 3.Vùng tiếp giáp (24 hải lý):\n\n-Tối đa 24 hải lý từ đường cơ sở.\n\n-Quốc gia có quyền kiểm soát để ngăn ngừa các vi phạm về hải quan, thuế, nhập cư, y tế.\n\n4.Vùng đặc quyền kinh tế – EEZ (200 hải lý):\n\n-Tối đa 200 hải lý từ đường cơ sở.\n\n-Quốc gia có quyền chủ quyền về khai thác tài nguyên, nhưng không có chủ quyền hoàn toàn như lãnh hải.\n\n5.Thềm lục địa:\n\n-Phần đáy biển và lòng đất dưới đáy biển kéo dài tự nhiên từ đất liền ra biển.\n\n-Quốc gia có quyền khai thác tài nguyên dưới đáy biển, có thể vượt quá 200 hải lý nếu đáp ứng điều kiện địa chất.
}

if(q.includes("cong uoc luat bien")){
return "UNCLOS 1982 (Công ước Luật Biển 1982)\n\n1. Lãnh hải \n\nĐiều 2 – Chế độ pháp lý của lãnh hải. \n\n-Quốc gia ven biển có chủ quyền hoàn toàn đối với lãnh hải, vùng trời bên trên, đáy biển và lòng đất dưới đáy biển.\n\nĐiều 3 – Chiều rộng lãnh hải. \n\n -Quốc gia có quyền thiết lập lãnh hải rộng tối đa 12 hải lý tính từ đường cơ sở.\n\n ->Ý nghĩa: Khẳng định chủ quyền đầy đủ như trên lãnh thổ đất liền.\n\n2. Vùng đặc quyền kinh tế (EEZ)\n\nĐiều 55 – Thiết lập EEZ.\n\nĐiều 56 – Quyền, quyền tài phán và nghĩa vụ của quốc gia ven biển.\n\n-Quốc gia ven biển có quyền chủ quyền đối với:\n\n●Thăm dò, khai thác, bảo tồn và quản lý tài nguyên thiên nhiên (sinh vật và không sinh vật)\n\n●Hoạt động kinh tế khác (năng lượng gió, dòng hải lưu…)\n\nĐiều 57 – Chiều rộng EEZ\n\n-EEZ không vượt quá 200 hải lý từ đường cơ sở.\n\n->Ý nghĩa: Đây là cơ sở pháp lý cực kỳ quan trọng bảo vệ quyền khai thác tài nguyên biển.\n\n3. Thềm lục địa:\n\nĐiều 77 – Quyền của quốc gia ven biển đối với thềm lục địa. \n\nQuốc gia ven biển có quyền chủ quyền đương nhiên và độc quyền trong việc thăm dò và khai thác tài nguyên thiên nhiên tại thềm lục địa.\n\nQuyền này tồn tại ipso facto và ab initio (đương nhiên và không cần tuyên bố).
}

if(q.includes("cong uoc Geneva")){
return "Công ước Geneva 1958 về Luật Biển: \n\nBao gồm 4 công ước, trong đó liên quan trực tiếp nhất là:\n\n1. Công ước về Lãnh hải và Vùng tiếp giáp:\n\nĐiều 1–2\n\n-Quốc gia ven biển có chủ quyền đối với lãnh hải.\n\n2. Công ước về Thềm lục địa 1958.\n\nĐiều 2:\n\n-Quốc gia ven biển có quyền chủ quyền đối với thềm lục địa nhằm mục đích thăm dò và khai thác tài nguyên thiên nhiên.
}

if(q.includes("cong uoc bien ca")){
return "Công ước về Biển Cả 1958 (High Seas Convention)\n\nĐiều 2 – Chế độ pháp lý biển cả\n\n-Biển cả thuộc quyền tự do của mọi quốc gia (tự do hàng hải, đánh bắt, đặt cáp ngầm…).\n\n-Tuy nhiên:\n\n●Biển cả không thuộc chủ quyền của bất kỳ quốc gia nào.\n\n●Không được sử dụng biển cả vào mục đích trái với lợi ích chung.\n\n-Điều này gián tiếp bảo vệ EEZ và thềm lục địa của quốc gia ven biển bằng cách phân định rõ phạm vi biển cả"
}

if(q.includes("giai quyet tranh chap")){
return "Giải Quyết Tranh Chấp Và Án Lệ: Cơ chế giải quyết theo UNCLOS, ví dụ phán quyết 2016 về Biển Đông giữa Philippines vs Trung Quốc (2016) \n\n1. Cơ Chế Giải Quyết Tranh Chấp Theo UNCLOS: \n\nUNCLOS quy định cơ chế giải quyết tranh chấp tại Phần XV (Điều 279–299), nhằm đảm bảo các tranh chấp về giải thích hoặc áp dụng Công ước được giải quyết hòa bình và hiệu quả. Cơ chế này kết hợp giữa các phương thức tự nguyện và bắt buộc, thể hiện sự linh hoạt nhưng đồng thời cung cấp biện pháp ràng buộc pháp lý. \n\n-Nghĩa vụ hòa bình (Điều 279): Các quốc gia thành viên phải giải quyết tranh chấp bằng các biện pháp hòa bình theo Điều 2(3) và Điều 33(1) của Hiến chương Liên Hợp Quốc (đàm phán, điều tra, hòa giải, trọng tài, xét xử tư pháp, hoặc các biện pháp khác do các bên thỏa thuận).\n\n-Quy trình bắt buộc (Điều 286–287): Nếu không đạt được thỏa thuận qua các biện pháp tự nguyện, bất kỳ bên nào cũng có quyền đưa tranh chấp ra một cơ quan xét xử có thẩm quyền. Các bên phải chọn một trong bốn cơ chế sau (thông qua tuyên bố khi ký, phê chuẩn hoặc sau đó):\n\n ● Tòa án Quốc tế về Luật Biển (ITLOS) – theo Phụ lục VI.\n\n ●Tòa án Công lý Quốc tế (ICJ).\n\n●Tòa trọng tài theo Phụ lục VII (thường được sử dụng trong các tranh chấp biển).\n\n●Tòa trọng tài chuyên biệt theo Phụ lục VIII (cho các vấn đề khoa học, môi trường, đánh bắt hoặc hàng hải).\n\n - Ngoại lệ và hạn chế: Một số tranh chấp không thuộc phạm vi bắt buộc, ví dụ tranh chấp chủ quyền lãnh thổ đất liền (sovereignty over land territory), biên giới biển chưa phân định, hoặc tranh chấp liên quan đến hoạt động quân sự (Điều 297–298).\n\n-Tính ràng buộc: Phán quyết của các cơ quan này là cuối cùng và có hiệu lực ràng buộc đối với các bên (Điều 296).\n\nCơ chế này là một trong những điểm tiến bộ quan trọng của UNCLOS, tạo ra hệ thống giải quyết tranh chấp bắt buộc đầu tiên trong luật biển quốc tế, giúp ngăn chặn leo thang xung đột.\n\n2. Ví Dụ: Phán Quyết Trọng Tài 2016 (Philippines kiện Trung Quốc)\n\nVụ việc The South China Sea Arbitration (Philippines v. China) được xử lý bởi Tòa Trọng tài theo Phụ lục VII UNCLOS, với Thư ký là Tòa Trọng tài Thường trực (Permanent Court of Arbitration – PCA) tại The Hague. Philippines khởi kiện năm 2013; Trung Quốc từ chối tham gia và không công nhận thẩm quyền của Tòa.\n\n- Ngày ra phán quyết: 12 tháng 7 năm 2016.\n\n- Các phát hiện chính (dựa trên văn bản phán quyết chính thức):\n\n- Yêu sách 'đường chín đoạn' (nine-dash line): Không có cơ sở pháp lý theo UNCLOS. Các quyền lịch sử mà Trung Quốc tuyên bố trong khu vực bên trong đường này không tồn tại nếu vượt quá giới hạn quyền lợi hải phận theo Công ước. UNCLOS không cho phép các quyền lịch sử vượt trội hơn các vùng biển được quy định (lãnh hải, EEZ, thềm lục địa).\n\n- Chế độ đảo (Điều 121): Tất cả các thực thể cao mực nước triều cao ở quần đảo Trường Sa (Spratly Islands) và bãi cạn Scarborough đều là "đá" (rocks) không thể duy trì sự sống con người hoặc đời sống kinh tế riêng biệt. Do đó, chúng chỉ tạo ra lãnh hải 12 hải lý, không tạo ra vùng đặc quyền kinh tế (EEZ) hoặc thềm lục địa.\n\n- Vi phạm của Trung Quốc:\n\n- Xây dựng đảo nhân tạo và hoạt động cải tạo đất tại một số thực thể ở Trường Sa gây hại nghiêm trọng và không thể phục hồi cho môi trường san hô (vi phạm nghĩa vụ bảo vệ môi trường biển theo Phần XII).\n\n- Can thiệp vào quyền chủ quyền của Philippines trong EEZ của mình (ví dụ: cản trở hoạt động khai thác dầu khí và đánh bắt cá).\n\n- Vi phạm nghĩa vụ không làm trầm trọng thêm tranh chấp trong quá trình giải quyết.\n\n- Tòa không phán quyết: Về chủ quyền lãnh thổ đối với các đảo (sovereignty over land), vì UNCLOS không điều chỉnh vấn đề này.\n\n- Hiệu lực pháp lý: Phán quyết là cuối cùng và ràng buộc đối với cả Philippines và Trung Quốc (Điều 296 UNCLOS). Tuy nhiên, Trung Quốc bác bỏ phán quyết, gọi là 'vô hiệu và không có giá trị ràng buộc'. Đến nay, nhiều quốc gia (bao gồm Mỹ, Úc, Nhật Bản, EU) ủng hộ việc tuân thủ phán quyết, trong khi một số khác giữ lập trường trung lập hoặc không ủng hộ.\n\nPhán quyết này là án lệ quan trọng nhất về UNCLOS kể từ khi Công ước có hiệu lực, làm rõ nhiều quy định mơ hồ (như Điều 121 và quyền lịch sử), đồng thời khẳng định tính ưu việt của Công ước trong việc phân định quyền lợi hải phận. Nó cung cấp cơ sở pháp lý vững chắc cho các quốc gia ven Biển Đông trong việc bảo vệ quyền lợi hợp pháp.

n công nghệ cao (lồng bè chịu lực, giám sát bằng AI)\n\n2. Quy hoạch Không gian Biển (Marine Spatial Planning): \n\n-Phân vùng rõ rệt: Xác định rõ các vùng bảo tồn nghiêm ngặt, phát triển công nghiệp cảng biển, dành cho du lịch. \n\n-Thiết lập hành lang bảo vệ: Đảm bảo các công trình xây dựng ven biển phải cách mực nước biển một khoảng an toàn để ứng phó với nước biển dâng.\n\n3. Hạ tầng Thích ứng Biến đổi Khí hậu:\n\n-Hệ sinh thái tự nhiên là rào cản: Phục hồi rừng ngập mặn và rạn san hô.\n\n-Hệ thống tuần hoàn tài nguyên: Xây dựng các nhà máy lọc nước mặn thành nước ngọt và hệ thống tái chế rác thải tại chỗ trên các đảo lớn.\n\n4. Gắn liền với Sinh kế và Công bằng Xã hội:\n\n-Chuyển đổi nghề nghiệp: Hỗ trợ ngư dân chuyển từ đánh bắt sang làm dịch vụ du lịch hoặc nuôi trồng thủy sản bền vững.\n\n-Giáo dục và Đào tạo: Nâng cao kỹ năng cho người dân vùng biển để họ trở thành những người trực tiếp bảo vệ và quản lý tài nguyên tại địa phương

// ===== Hiệu ứng gõ chữ =====
function typeEffect(text, element){
let i=0;
let speed=20;
let timer=setInterval(()=>{
element.innerHTML+=text.charAt(i);
i++;
if(i>=text.length) clearInterval(timer);
},speed);
}

// ===== Gửi tin nhắn =====
function send(){
let input=document.getElementById("input");
let chat=document.getElementById("chat");

if(input.value.trim()==="") return;

let userMsg=document.createElement("div");
userMsg.className="msg user";
userMsg.innerText=input.value;
chat.appendChild(userMsg);

let botMsg=document.createElement("div");
botMsg.className="msg bot";
chat.appendChild(botMsg);

let answer=knowledge(normalize(input.value));
typeEffect(answer,botMsg);

chat.scrollTop=chat.scrollHeight;

// lưu lịch sử
localStorage.setItem("chatHistory",chat.innerHTML);

input.value="";
}

// ===== Load lịch sử =====
window.onload=function(){
let chat=document.getElementById("chat");
let saved=localStorage.getItem("chatHistory");
if(saved){
chat.innerHTML=saved;
}
}

</script>
